<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芽宝的歌单</title>
    <style>
        /* 基础设置 */
        :root {
            --theme-pink: #FFB6C1;
            --theme-light-pink: #FFF0F5;
            --theme-deep-pink: #FF69B4;
            --text-color: #5C3A3A;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 20px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--theme-light-pink);
            font-family: "Comic Sans MS", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* 顶部头图区域 */
        .header-container {
            position: relative;
            width: 100%;
            height: 750px; /* 稍微加高一点以适应图片标题 */
            overflow: hidden;
        }

        .header-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
        }

        .header-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            background: linear-gradient(to top, var(--theme-light-pink) 0%, rgba(255,240,245,0) 100%);
        }

        /* 标题与链接栏 */
        .title-area {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* 替换后的图片标题 */
        .title-img {
            max-width: 60%;
            max-height: 220px;
            object-fit: contain;
            margin-bottom: 20px;
            /* 添加一点粉色光晕让图片融入背景 */
            filter: drop-shadow(0px 4px 10px rgba(255, 105, 180, 0.5));
        }

        /* 链接容器 */
        .link-container {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* 主播链接样式 */
        .host-info {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.2);
            text-decoration: none;
            color: var(--theme-deep-pink);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            font-weight: bold;
            height: 40px;
            box-sizing: border-box;
        }

        .host-info:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4);
            background: white;
        }

        .host-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--theme-pink);
            object-fit: cover;
            margin-right: 8px;
        }

        .host-name {
            font-size: 16px;
        }

        /* 右侧无头像按钮特殊样式 */
        .no-avatar {
            padding: 8px 25px;
        }

        /* 主体内容区域 */
        .main-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 20px 80px 20px;
            position: relative;
            z-index: 10;
        }

        /* 歌单网格布局 */
        .song-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        /* 字母分组隔断标题 */
        .group-title {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            margin: 30px 0 10px 0;
            scroll-margin-top: 20px;
        }

        .group-title:first-child {
            margin-top: 10px;
        }

        .group-title::before, .group-title::after {
            content: '';
            flex-grow: 1;
            height: 3px;
            background: linear-gradient(to right, transparent, var(--theme-pink));
            border-radius: 3px;
        }

        .group-title::after {
            background: linear-gradient(to left, transparent, var(--theme-pink));
        }

        .group-title .letter {
            background: var(--theme-deep-pink);
            color: white;
            font-size: 20px;
            font-weight: bold;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 20px;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.5);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* 单首歌曲卡片 */
        .song-item {
            background: white;
            border-radius: 15px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.3);
            transition: all 0.2s ease;
            border: 1px solid #FFE4E1;
        }

        .song-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 105, 180, 0.4);
            border-color: var(--theme-pink);
        }

        .song-name {
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
            flex-grow: 1;
        }

        /* 复制按钮 */
        .copy-btn {
            background: var(--theme-light-pink);
            border: none;
            border-radius: 8px;
            color: var(--theme-deep-pink);
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            background: var(--theme-deep-pink);
            color: white;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        /* 右侧悬浮字母导航 */
        .alphabet-nav {
            position: fixed;
            right: 170px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px 6px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.5);
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .alphabet-nav a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            color: var(--text-color);
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .alphabet-nav a:hover, .alphabet-nav a.active {
            background: var(--theme-deep-pink);
            color: white;
            transform: scale(1.15);
        }

        /* 复制成功提示 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(255, 105, 180, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 两侧装饰图 */
        .decorations {
            position: fixed;
            top: 0;
            height: 100vh;
            width: 150px;
            pointer-events: none;
            z-index: 5;
        }

        .decorations.left { left: 10px; }
        .decorations.right { right: 10px; }

        .deco-img {
            position: absolute;
            width: 120px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        }

        .deco-1 { top: 15%; left: 0; animation-delay: 0s; }
        .deco-2 { top: 45%; left: 20px; animation-delay: 1s; }
        .deco-3 { top: 75%; left: -10px; animation-delay: 2s; }
        .deco-4 { top: 20%; right: 0; animation-delay: 0.5s; }
        .deco-5 { top: 50%; right: 20px; animation-delay: 1.5s; }
        .deco-6 { top: 80%; right: -10px; animation-delay: 2.5s; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* 响应式设计 */
        @media (max-width: 1300px) {
            .alphabet-nav { right: 20px; }
        }

        @media (max-width: 1200px) {
            .decorations { display: none; }
            .main-content { padding: 20px 30px 80px 30px; }
        }

        @media (max-width: 768px) {
            .header-container { height: 300px; }
            .title-img { max-width: 80%; max-height: 80px; }
            .song-list { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .alphabet-nav { display: none; }
            .group-title .letter { width: 35px; height: 35px; font-size: 16px; margin: 0 10px; }
            .link-container { flex-direction: column; gap: 10px; }
        }
    </style>
</head>

        // 获取中文字符串拼音首字母
        function getFirstLetter(str) {
            const char = str.charAt(0).toUpperCase();
            if (/[A-Z]/.test(char)) return char;
            if (/[0-9]/.test(char)) return '#';

            const boundaries = [
                { letter: 'A', char: '阿' }, { letter: 'B', char: '八' }, { letter: 'C', char: '擦' },
                { letter: 'D', char: '搭' }, { letter: 'E', char: '蛾' }, { letter: 'F', char: '发' },
                { letter: 'G', char: '噶' }, { letter: 'H', char: '哈' }, { letter: 'J', char: '击' },
                { letter: 'K', char: '喀' }, { letter: 'L', char: '垃' }, { letter: 'M', char: '妈' },
                { letter: 'N', char: '拿' }, { letter: 'O', char: '哦' }, { letter: 'P', char: '啪' },
                { letter: 'Q', char: '期' }, { letter: 'R', char: '然' }, { letter: 'S', char: '撒' },
                { letter: 'T', char: '塌' }, { letter: 'W', char: '挖' }, { letter: 'X', char: '昔' },
                { letter: 'Y', char: '压' }, { letter: 'Z', char: '匝' }
            ];

            for (let i = boundaries.length - 1; i >= 0; i--) {
                if (char.localeCompare(boundaries[i].char, 'zh-CN') >= 0) {
                    return boundaries[i].letter;
                }
            }
            return '#';
        }

        // 处理数据
        function processSongs(text) {
            let songs = text.split(/[\s\n]+/).filter(song => song.trim() !== '');
            songs = [...new Set(songs)];
            songs.sort((a, b) => a.localeCompare(b, 'zh-CN'));
            
            const grouped = {};
            songs.forEach(song => {
                const letter = getFirstLetter(song);
                if (!grouped[letter]) grouped[letter] = [];
                grouped[letter].push(song);
            });
            return grouped;
        }

        // 渲染歌单和导航栏
        function renderSongs(groupedData) {
            const container = document.getElementById('songList');
            const navContainer = document.getElementById('alphabetNav');
            container.innerHTML = '';
            navContainer.innerHTML = '';

            const sortedLetters = Object.keys(groupedData).sort();

            sortedLetters.forEach(letter => {
                // 字母分组隔断
                const groupTitle = document.createElement('div');
                groupTitle.className = 'group-title';
                groupTitle.id = `group-${letter}`;
                groupTitle.innerHTML = `<span class="letter">${letter}</span>`;
                container.appendChild(groupTitle);

                // 悬浮导航链接
                const navLink = document.createElement('a');
                navLink.href = `#group-${letter}`;
                navLink.textContent = letter;
                navLink.title = `跳转到 ${letter}`;
                navContainer.appendChild(navLink);

                // 歌曲渲染
                groupedData[letter].forEach(song => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'song-item';

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'song-name';
                    nameSpan.textContent = song;
                    nameSpan.title = song;

                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.textContent = '复制';
                    copyBtn.onclick = () => copyToClipboard(song);

                    itemDiv.appendChild(nameSpan);
                    itemDiv.appendChild(copyBtn);
                    container.appendChild(itemDiv);
                });
            });
        }

        // 复制到剪贴板
        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                }).catch(err => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                alert('复制失败，请手动复制：' + text);
            }
            document.body.removeChild(textArea);
        }

        // 提示框
        let toastTimeout;
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 初始化
        window.onload = () => {
            const groupedSongs = processSongs(rawData);
            renderSongs(groupedSongs);
            
            // 滚动监听，高亮字母导航
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        const letter = id.replace('group-', '');
                        document.querySelectorAll('.alphabet-nav a').forEach(a => {
                            a.classList.remove('active');
                            if(a.textContent === letter) a.classList.add('active');
                        });
                    }
                });
            }, { rootMargin: '-50px 0px -50% 0px' });

            document.querySelectorAll('.group-title').forEach(title => {
                observer.observe(title);
            });
        };
    </script>
</body>
</html>
